name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # Render scale for the cache-level chart (1, 2, 3 …).
      # Affects both the SVG `width`/`height` attributes and the PNG raster width.
      # Override per-run via repo/workflow env if you need denser PNGs.
      CHART_RENDER_SCALE: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can resolve the workflow-file SHA at past
          # commits (used to pin cache-history queries to the current CI version).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve ESLint version
        id: eslint-version
        run: |
          VERSION=$(node -p "require('./node_modules/eslint/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ESLint version: $VERSION"

      - name: Restore ESLint cache
        id: eslint-cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          # Cache key dimensions:
          #   - OS                       → runner-specific binaries
          #   - ESLint version           → cache format changes between versions
          #   - Lint config + tsconfig   → rule changes invalidate results
          #   - Lockfile                 → plugin/parser updates invalidate results
          #   - Source globs hash        → narrows to actually-linted files
          #   - SHA                      → unique per commit (write key)
          key: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb', 'src/**/*.ts', 'src/**/*.tsx') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb', 'src/**/*.ts', 'src/**/*.tsx') }}-
            ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb') }}-
            ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-

      - name: Report ESLint cache status
        if: always()
        env:
          PRIMARY_KEY: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb', 'src/**/*.ts', 'src/**/*.tsx') }}-${{ github.sha }}
          MATCHED_KEY: ${{ steps.eslint-cache.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.eslint-cache.outputs.cache-hit }}
          SRC_KEY_PREFIX: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb', 'src/**/*.ts', 'src/**/*.tsx') }}-
          CFG_KEY_PREFIX: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb') }}-
          VER_KEY_PREFIX: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-
        run: |
          if [ "$EXACT_HIT" = "true" ]; then
            STATUS="✅ Exact hit"
            LEVEL="L0 — primary key (same commit)"
          elif [ -z "$MATCHED_KEY" ]; then
            STATUS="❌ Miss (no cache restored)"
            LEVEL="—"
          else
            STATUS="♻️ Partial restore"
            case "$MATCHED_KEY" in
              "$SRC_KEY_PREFIX"*) LEVEL="L1 — same sources + config (different commit)" ;;
              "$CFG_KEY_PREFIX"*) LEVEL="L2 — same config + deps (sources changed)" ;;
              "$VER_KEY_PREFIX"*) LEVEL="L3 — same ESLint version only (config changed)" ;;
              *)                  LEVEL="L? — unrecognized restore-key" ;;
            esac
          fi

          # Cache size (if restored)
          if [ -d node_modules/.cache/eslint ]; then
            SIZE=$(du -sh node_modules/.cache/eslint 2>/dev/null | cut -f1)
            FILES=$(find node_modules/.cache/eslint -type f 2>/dev/null | wc -l | tr -d ' ')
          else
            SIZE="0"
            FILES="0"
          fi

          {
            echo "## ESLint cache"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | $STATUS |"
            echo "| Restore level | $LEVEL |"
            echo "| ESLint version | ${{ steps.eslint-version.outputs.version }} |"
            echo "| Primary key | \`$PRIMARY_KEY\` |"
            echo "| Matched key | \`${MATCHED_KEY:-<none>}\` |"
            echo "| Cache size | $SIZE ($FILES files) |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "ESLint cache: $STATUS — $LEVEL"
          echo "  primary key : $PRIMARY_KEY"
          echo "  matched key : ${MATCHED_KEY:-<none>}"
          echo "  cache size  : $SIZE ($FILES files)"

      - name: Run ESLint (JSON report)
        id: eslint
        continue-on-error: true
        env:
          # Emit ESLint's per-rule timing breakdown to stderr.
          TIMING: "20"
        run: |
          mkdir -p reports
          START=$(date +%s%3N)
          # Capture rule timing to a separate file; preserve stdout/exit code.
          bun run lint:report 2> reports/eslint-rule-timing.txt
          STATUS=$?
          END=$(date +%s%3N)
          echo "duration_ms=$((END - START))" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Generate HTML report
        id: eslint-html
        if: always()
        continue-on-error: true
        run: |
          START=$(date +%s%3N)
          bun run lint:report:html
          END=$(date +%s%3N)
          echo "duration_ms=$((END - START))" >> "$GITHUB_OUTPUT"

      - name: Extract failed-files summary
        id: eslint-extract
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports
          START=$(date +%s%3N)
          node -e "
            const fs = require('fs');
            const path = 'reports/eslint-report.json';
            if (!fs.existsSync(path)) { console.log('No report'); process.exit(0); }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const failed = data
              .filter(f => f.errorCount > 0 || f.warningCount > 0)
              .map(f => ({
                filePath: f.filePath.replace(process.cwd() + '/', ''),
                errorCount: f.errorCount,
                warningCount: f.warningCount,
                fixableErrorCount: f.fixableErrorCount,
                fixableWarningCount: f.fixableWarningCount,
                rules: [...new Set(f.messages.map(m => m.ruleId).filter(Boolean))],
              }))
              .sort((a, b) => (b.errorCount - a.errorCount) || (b.warningCount - a.warningCount));
            fs.writeFileSync('reports/eslint-failed-files.json', JSON.stringify(failed, null, 2));
            const totals = failed.reduce((acc, f) => ({
              errors: acc.errors + f.errorCount,
              warnings: acc.warnings + f.warningCount,
            }), { errors: 0, warnings: 0 });
            console.log('Failed files:', failed.length, 'errors:', totals.errors, 'warnings:', totals.warnings);
            // Append top-10 to job summary
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (summaryPath && failed.length > 0) {
              const top = failed.slice(0, 10).map(f =>
                \`| \\\`\${f.filePath}\\\` | \${f.errorCount} | \${f.warningCount} | \${f.rules.slice(0, 3).join(', ')} |\`
              ).join('\n');
              fs.appendFileSync(summaryPath,
                \`\n## ESLint failed files (top 10 of \${failed.length})\n\n\` +
                \`Total: **\${totals.errors} errors**, **\${totals.warnings} warnings**\n\n\` +
                \`| File | Errors | Warnings | Top rules |\n| --- | ---: | ---: | --- |\n\${top}\n\`
              );
            }
          "
          END=$(date +%s%3N)
          echo "duration_ms=$((END - START))" >> "$GITHUB_OUTPUT"

      - name: Write ESLint timing metrics
        if: always()
        continue-on-error: true
        env:
          LINT_MS: ${{ steps.eslint.outputs.duration_ms }}
          HTML_MS: ${{ steps.eslint-html.outputs.duration_ms }}
          EXTRACT_MS: ${{ steps.eslint-extract.outputs.duration_ms }}
          CACHE_STATUS: ${{ steps.eslint-cache.outputs.cache-hit && 'exact-hit' || (steps.eslint-cache.outputs.cache-matched-key && 'partial' || 'miss') }}
          ESLINT_VERSION: ${{ steps.eslint-version.outputs.version }}
        run: |
          mkdir -p reports
          LINT_MS_VAL=${LINT_MS:-0}
          HTML_MS_VAL=${HTML_MS:-0}
          EXTRACT_MS_VAL=${EXTRACT_MS:-0}
          TOTAL_MS=$((LINT_MS_VAL + HTML_MS_VAL + EXTRACT_MS_VAL))

          fmt() { awk "BEGIN { printf \"%.2fs\", $1 / 1000 }"; }

          # Pull top-5 slowest rules from ESLint TIMING output (if present)
          TOP_RULES_JSON="[]"
          if [ -s reports/eslint-rule-timing.txt ]; then
            TOP_RULES_JSON=$(awk '
              /^Rule/ { capture=1; next }
              capture && /^[a-zA-Z@]/ {
                rule=$1; time=$2;
                gsub(/[^0-9.]/, "", time);
                if (time != "" && rule != "") print rule"\t"time;
              }
            ' reports/eslint-rule-timing.txt | sort -k2 -gr | head -n 5 | \
              node -e "
                const lines = require('fs').readFileSync(0, 'utf8').trim().split('\n').filter(Boolean);
                const out = lines.map(l => { const [r, t] = l.split('\t'); return { rule: r, ms: Number(t) }; });
                process.stdout.write(JSON.stringify(out));
              " 2>/dev/null || echo "[]")
          fi

          # Write JSON metrics artifact
          node -e "
            const fs = require('fs');
            const metrics = {
              eslintVersion: process.env.ESLINT_VERSION,
              cacheStatus: process.env.CACHE_STATUS,
              durations: {
                lintMs: Number(process.env.LINT_MS_VAL),
                htmlReportMs: Number(process.env.HTML_MS_VAL),
                extractFailedMs: Number(process.env.EXTRACT_MS_VAL),
                totalMs: Number(process.env.TOTAL_MS),
              },
              topSlowRules: ${TOP_RULES_JSON},
              runId: process.env.GITHUB_RUN_ID,
              sha: process.env.GITHUB_SHA,
              branch: process.env.GITHUB_REF_NAME,
              timestamp: new Date().toISOString(),
            };
            fs.writeFileSync('reports/eslint-timing.json', JSON.stringify(metrics, null, 2));
          "

          # Inject the same timing tables into the HTML report (appended before </body>)
          node -e "
            const fs = require('fs');
            const htmlPath = 'reports/eslint-report.html';
            if (!fs.existsSync(htmlPath)) { console.log('No HTML report to enrich'); process.exit(0); }
            const metrics = JSON.parse(fs.readFileSync('reports/eslint-timing.json', 'utf8'));
            const fmt = (ms) => (ms / 1000).toFixed(2) + 's';
            const d = metrics.durations;

            const stepRows = [
              ['Lint + JSON report', d.lintMs],
              ['HTML report', d.htmlReportMs],
              ['Failed-files extraction', d.extractFailedMs],
            ].map(([label, ms]) => \`<tr><td>\${label}</td><td style='text-align:right'>\${fmt(ms)}</td></tr>\`).join('');

            const ruleRows = (metrics.topSlowRules || []).length
              ? metrics.topSlowRules.map(r =>
                  \`<tr><td><code>\${r.rule}</code></td><td style='text-align:right'>\${r.ms.toFixed(2)} ms</td></tr>\`
                ).join('')
              : \`<tr><td colspan='2' style='color:#888;text-align:center'>No rule timing data captured</td></tr>\`;

            const section = \`
<section style='margin:32px auto;max-width:960px;padding:24px;border-top:2px solid #eee;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif'>
  <h2 style='margin-top:0'>⏱ ESLint timing</h2>
  <p style='color:#666;margin:4px 0 16px'>
    ESLint <strong>v\${metrics.eslintVersion}</strong> ·
    cache <strong>\${metrics.cacheStatus}</strong> ·
    run <a href='https://github.com/\${process.env.GITHUB_REPOSITORY}/actions/runs/\${metrics.runId}'>#\${metrics.runId}</a> ·
    \${metrics.timestamp}
  </p>
  <h3>Per-step durations</h3>
  <table style='width:100%;border-collapse:collapse'>
    <thead><tr style='background:#f6f8fa'><th style='text-align:left;padding:8px'>Step</th><th style='text-align:right;padding:8px'>Duration</th></tr></thead>
    <tbody>
      \${stepRows}
      <tr style='font-weight:bold;background:#fafbfc'><td style='padding:8px'>Total</td><td style='text-align:right;padding:8px'>\${fmt(d.totalMs)}</td></tr>
    </tbody>
  </table>
  <h3 style='margin-top:24px'>Top slowest rules</h3>
  <table style='width:100%;border-collapse:collapse'>
    <thead><tr style='background:#f6f8fa'><th style='text-align:left;padding:8px'>Rule</th><th style='text-align:right;padding:8px'>Time</th></tr></thead>
    <tbody>\${ruleRows}</tbody>
  </table>
</section>
\`;

            let html = fs.readFileSync(htmlPath, 'utf8');
            html = html.includes('</body>')
              ? html.replace('</body>', section + '</body>')
              : html + section;
            fs.writeFileSync(htmlPath, html);
            console.log('Enriched HTML report with timing tables.');
          "

      - name: Append timing metrics to summary
        if: always()
        continue-on-error: true
        env:
          LINT_MS: ${{ steps.eslint.outputs.duration_ms }}
          HTML_MS: ${{ steps.eslint-html.outputs.duration_ms }}
          EXTRACT_MS: ${{ steps.eslint-extract.outputs.duration_ms }}
        run: |
          fmt() { awk "BEGIN { printf \"%.2fs\", ${1:-0} / 1000 }"; }
          LINT_MS_VAL=${LINT_MS:-0}
          HTML_MS_VAL=${HTML_MS:-0}
          EXTRACT_MS_VAL=${EXTRACT_MS:-0}
          TOTAL_MS=$((LINT_MS_VAL + HTML_MS_VAL + EXTRACT_MS_VAL))

          # Grep-friendly markers consumed by the cache-vs-time history step below.
          echo "METRIC lint_total_ms=$TOTAL_MS"
          echo "METRIC lint_only_ms=$LINT_MS_VAL"

          {
            echo ""
            echo "## ESLint timing"
            echo ""
            echo "| Step | Duration |"
            echo "| --- | ---: |"
            echo "| Lint + JSON report | $(fmt $LINT_MS_VAL) |"
            echo "| HTML report | $(fmt $HTML_MS_VAL) |"
            echo "| Failed-files extraction | $(fmt $EXTRACT_MS_VAL) |"
            echo "| **Total** | **$(fmt $TOTAL_MS)** |"

            if [ -s reports/eslint-rule-timing.txt ]; then
              echo ""
              echo "<details><summary>Top slowest rules (ESLint TIMING=20)</summary>"
              echo ""
              echo '```'
              head -n 25 reports/eslint-rule-timing.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate PR with ESLint findings
        if: always()
        uses: ataylorme/eslint-annotate-action@v3
        with:
          report-json: reports/eslint-report.json
          fail-on-warning: false
          fail-on-error: false
          markdown-report-on-step-summary: true

      - name: Compute cache hit-rate (last 20 runs)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: ci.yml
          JOB_NAME: Lint
          STEP_NAME: Report ESLint cache status
        run: |
          set -e
          # Pin history to the SAME workflow file version as the current run.
          # This avoids mixing metrics across CI config changes (different rules,
          # different cache keys, different timing instrumentation, etc.).
          WORKFLOW_PATH=".github/workflows/${WORKFLOW_FILE}"
          CURRENT_WF_SHA=$(git rev-parse "${{ github.sha }}:${WORKFLOW_PATH}" 2>/dev/null || echo "")
          if [ -z "$CURRENT_WF_SHA" ]; then
            echo "Could not resolve workflow file SHA — skipping history (refusing to mix versions)."
            {
              echo ""
              echo "## ESLint cache hit-rate (history)"
              echo ""
              echo "_Skipped — could not pin to current workflow version._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Pinning history to workflow file SHA: $CURRENT_WF_SHA"

          # Pull last 50 completed runs on this branch (over-fetch, then filter
          # down to runs whose workflow file matches CURRENT_WF_SHA, keep ≤20).
          BRANCH="${{ github.ref_name }}"
          CANDIDATE_RUNS=$(gh api -X GET \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f branch="$BRANCH" -f status=completed -f per_page=50 \
            --jq '.workflow_runs[] | "\(.id)\t\(.head_sha)\t\(.created_at)\t\(.event)\t\(.conclusion // "?")\t\(.html_url)"')

          # Filter: keep only runs whose workflow file content matches the current SHA.
          MATCHED_RUNS=""
          MATCHED_JSONL=""
          KEPT=0
          while IFS=$'\t' read -r RID HEAD_SHA CREATED EVENT CONCLUSION URL; do
            [ -z "$RID" ] && continue
            [ "$KEPT" -ge 20 ] && break
            WF_SHA_AT_RUN=$(git rev-parse "$HEAD_SHA:${WORKFLOW_PATH}" 2>/dev/null || echo "")
            if [ "$WF_SHA_AT_RUN" = "$CURRENT_WF_SHA" ]; then
              MATCHED_RUNS="$MATCHED_RUNS $RID"
              MATCHED_JSONL="$MATCHED_JSONL$(jq -nc \
                --arg id "$RID" --arg head_sha "$HEAD_SHA" \
                --arg created_at "$CREATED" --arg event "$EVENT" \
                --arg conclusion "$CONCLUSION" --arg url "$URL" \
                --arg workflow_file_sha "$WF_SHA_AT_RUN" \
                '{id:$id, head_sha:$head_sha, created_at:$created_at, event:$event, conclusion:$conclusion, workflow_file_sha:$workflow_file_sha, html_url:$url}')\n"
              KEPT=$((KEPT + 1))
            fi
          done <<< "$CANDIDATE_RUNS"
          RUNS="$MATCHED_RUNS"
          echo "Kept $KEPT runs matching current workflow version (out of up to 50 candidates)."

          # Persist debug metadata + matched runs for the artifact upload.
          mkdir -p reports
          MATCHED_JSON=$(printf '%s' "$MATCHED_JSONL" | jq -s '.' 2>/dev/null || echo '[]')
          jq -n \
            --arg current_workflow_file_sha "$CURRENT_WF_SHA" \
            --arg workflow_path "$WORKFLOW_PATH" \
            --arg current_run_id "${{ github.run_id }}" \
            --arg current_head_sha "${{ github.sha }}" \
            --arg branch "$BRANCH" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson matched "$MATCHED_JSON" \
            --argjson candidates_scanned 50 \
            --argjson matched_count "$KEPT" \
            '{
              source: "compute-cache-hit-rate",
              branch: $branch,
              workflow_path: $workflow_path,
              current_workflow_file_sha: $current_workflow_file_sha,
              current_run_id: $current_run_id,
              current_head_sha: $current_head_sha,
              generated_at: $generated_at,
              candidates_scanned: $candidates_scanned,
              matched_count: $matched_count,
              workflow_version: {
                sha_short: ($current_workflow_file_sha | .[0:7]),
                sha_full: $current_workflow_file_sha,
                candidates_scanned: $candidates_scanned,
                matched_count: $matched_count
              },
              matched_runs: $matched
            }' > reports/cache-history-debug.json
          echo "Wrote reports/cache-history-debug.json (matched=$KEPT)"

          TOTAL=0; EXACT=0; PARTIAL=0; MISS=0
          for RUN_ID in $RUNS; do
            # Skip the current run (it isn't completed yet)
            if [ "$RUN_ID" = "${{ github.run_id }}" ]; then continue; fi
            JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
              --jq ".jobs[] | select(.name==\"$JOB_NAME\") | .id" | head -n1)
            if [ -z "$JOB_ID" ]; then continue; fi
            LOG=$(gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" 2>/dev/null || echo "")
            if echo "$LOG" | grep -q "ESLint cache: ✅ Exact hit"; then
              EXACT=$((EXACT + 1)); TOTAL=$((TOTAL + 1))
            elif echo "$LOG" | grep -q "ESLint cache: ♻️ Partial restore"; then
              PARTIAL=$((PARTIAL + 1)); TOTAL=$((TOTAL + 1))
            elif echo "$LOG" | grep -q "ESLint cache: ❌ Miss"; then
              MISS=$((MISS + 1)); TOTAL=$((TOTAL + 1))
            fi
          done

          if [ "$TOTAL" -eq 0 ]; then
            echo "No historical runs found yet."
            {
              echo ""
              echo "## ESLint cache hit-rate (history)"
              echo ""
              echo "_No prior completed runs on \`$BRANCH\` matching the current workflow version (\`${CURRENT_WF_SHA:0:7}\`) — metrics will appear once this CI version has accumulated history._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          HIT=$((EXACT + PARTIAL))
          HIT_RATE=$(awk "BEGIN { printf \"%.1f\", ($HIT / $TOTAL) * 100 }")
          EXACT_RATE=$(awk "BEGIN { printf \"%.1f\", ($EXACT / $TOTAL) * 100 }")

          {
            echo ""
            echo "## ESLint cache hit-rate (last $TOTAL runs on \`$BRANCH\`, workflow \`${CURRENT_WF_SHA:0:7}\`)"
            echo ""
            echo "| Metric | Count | % |"
            echo "| --- | ---: | ---: |"
            echo "| ✅ Exact hit | $EXACT | ${EXACT_RATE}% |"
            echo "| ♻️ Partial restore | $PARTIAL | $(awk "BEGIN { printf \"%.1f\", ($PARTIAL / $TOTAL) * 100 }")% |"
            echo "| ❌ Miss | $MISS | $(awk "BEGIN { printf \"%.1f\", ($MISS / $TOTAL) * 100 }")% |"
            echo "| **Overall hit-rate** | **$HIT / $TOTAL** | **${HIT_RATE}%** |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Cache hit-rate: ${HIT_RATE}% ($HIT/$TOTAL)"

      - name: Compare lint time by cache level (history)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: ci.yml
          JOB_NAME: Lint
          CURRENT_LINT_MS: ${{ steps.eslint.outputs.duration_ms }}
        run: |
          set -e
          # Pin to current workflow file SHA — never compare across CI versions.
          WORKFLOW_PATH=".github/workflows/${WORKFLOW_FILE}"
          CURRENT_WF_SHA=$(git rev-parse "${{ github.sha }}:${WORKFLOW_PATH}" 2>/dev/null || echo "")
          if [ -z "$CURRENT_WF_SHA" ]; then
            echo "Could not resolve workflow file SHA — skipping cache-vs-time history."
            {
              echo ""
              echo "## Lint time vs cache level (history)"
              echo ""
              echo "_Skipped — could not pin to current workflow version._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="${{ github.ref_name }}"
          CANDIDATE_RUNS=$(gh api -X GET \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs" \
            -f branch="$BRANCH" -f status=completed -f per_page=50 \
            --jq '.workflow_runs[] | "\(.id)\t\(.head_sha)\t\(.created_at)\t\(.event)\t\(.conclusion // "?")\t\(.html_url)"')

          RUNS=""
          MATCHED_JSONL=""
          KEPT=0
          while IFS=$'\t' read -r RID HEAD_SHA CREATED EVENT CONCLUSION URL; do
            [ -z "$RID" ] && continue
            [ "$KEPT" -ge 20 ] && break
            WF_SHA_AT_RUN=$(git rev-parse "$HEAD_SHA:${WORKFLOW_PATH}" 2>/dev/null || echo "")
            if [ "$WF_SHA_AT_RUN" = "$CURRENT_WF_SHA" ]; then
              RUNS="$RUNS $RID"
              MATCHED_JSONL="$MATCHED_JSONL$(jq -nc \
                --arg id "$RID" --arg head_sha "$HEAD_SHA" \
                --arg created_at "$CREATED" --arg event "$EVENT" \
                --arg conclusion "$CONCLUSION" --arg url "$URL" \
                --arg workflow_file_sha "$WF_SHA_AT_RUN" \
                '{id:$id, head_sha:$head_sha, created_at:$created_at, event:$event, conclusion:$conclusion, workflow_file_sha:$workflow_file_sha, html_url:$url}')\n"
              KEPT=$((KEPT + 1))
            fi
          done <<< "$CANDIDATE_RUNS"
          echo "Comparing $KEPT runs matching workflow ${CURRENT_WF_SHA:0:7}."

          mkdir -p reports
          MATCHED_JSON=$(printf '%s' "$MATCHED_JSONL" | jq -s '.' 2>/dev/null || echo '[]')
          jq -n \
            --arg current_workflow_file_sha "$CURRENT_WF_SHA" \
            --arg workflow_path "$WORKFLOW_PATH" \
            --arg current_run_id "${{ github.run_id }}" \
            --arg current_head_sha "${{ github.sha }}" \
            --arg branch "$BRANCH" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson matched "$MATCHED_JSON" \
            --argjson candidates_scanned 50 \
            --argjson matched_count "$KEPT" \
            '{
              source: "compare-lint-time-by-cache",
              branch: $branch,
              workflow_path: $workflow_path,
              current_workflow_file_sha: $current_workflow_file_sha,
              current_run_id: $current_run_id,
              current_head_sha: $current_head_sha,
              generated_at: $generated_at,
              candidates_scanned: $candidates_scanned,
              matched_count: $matched_count,
              workflow_version: {
                sha_short: ($current_workflow_file_sha | .[0:7]),
                sha_full: $current_workflow_file_sha,
                candidates_scanned: $candidates_scanned,
                matched_count: $matched_count
              },
              matched_runs: $matched
            }' > reports/lint-time-history-debug.json
          echo "Wrote reports/lint-time-history-debug.json (matched=$KEPT)"

          # Buckets: tab-separated lists of "ms" values per level
          : > /tmp/L0.txt; : > /tmp/L1.txt; : > /tmp/L2.txt; : > /tmp/L3.txt; : > /tmp/MISS.txt

          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" = "${{ github.run_id }}" ]; then continue; fi
            JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
              --jq ".jobs[] | select(.name==\"$JOB_NAME\") | .id" | head -n1)
            [ -z "$JOB_ID" ] && continue
            LOG=$(gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" 2>/dev/null || echo "")
            [ -z "$LOG" ] && continue

            # Pull the lint duration marker
            MS=$(echo "$LOG" | grep -oE 'METRIC lint_only_ms=[0-9]+' | head -n1 | cut -d= -f2)
            [ -z "$MS" ] && continue

            # Determine cache level from the cache status line
            if echo "$LOG" | grep -q "ESLint cache: ✅ Exact hit"; then
              echo "$MS" >> /tmp/L0.txt
            elif echo "$LOG" | grep -q "L1 — same sources"; then
              echo "$MS" >> /tmp/L1.txt
            elif echo "$LOG" | grep -q "L2 — same config"; then
              echo "$MS" >> /tmp/L2.txt
            elif echo "$LOG" | grep -q "L3 — same ESLint version"; then
              echo "$MS" >> /tmp/L3.txt
            elif echo "$LOG" | grep -q "ESLint cache: ❌ Miss"; then
              echo "$MS" >> /tmp/MISS.txt
            fi
          done

          # Helper: avg + min + max + count for a bucket file
          stats() {
            local f="$1"
            if [ ! -s "$f" ]; then echo "0|—|—|—"; return; fi
            awk '
              { sum += $1; n++; if (NR == 1 || $1 < min) min = $1; if ($1 > max) max = $1 }
              END {
                printf "%d|%.2fs|%.2fs|%.2fs", n, (sum/n)/1000, min/1000, max/1000
              }
            ' "$f"
          }

          L0=$(stats /tmp/L0.txt)
          L1=$(stats /tmp/L1.txt)
          L2=$(stats /tmp/L2.txt)
          L3=$(stats /tmp/L3.txt)
          MS=$(stats /tmp/MISS.txt)

          # Baseline = miss avg (or L3 if no miss data)
          BASELINE_MS=$(awk -F'|' '{print $2}' <<<"$MS" | sed 's/s//')
          if [ -z "$BASELINE_MS" ] || [ "$BASELINE_MS" = "—" ]; then
            BASELINE_MS=$(awk -F'|' '{print $2}' <<<"$L3" | sed 's/s//')
          fi

          # Speedup vs baseline
          speedup() {
            local avg_str="$1"
            local avg=$(echo "$avg_str" | sed 's/s//')
            if [ -z "$avg" ] || [ "$avg" = "—" ] || [ -z "$BASELINE_MS" ] || [ "$BASELINE_MS" = "—" ] || [ "$avg" = "0.00" ]; then
              echo "—"; return
            fi
            awk -v b="$BASELINE_MS" -v a="$avg" 'BEGIN { if (a == 0) print "—"; else printf "%.2fx", b/a }'
          }

          row() {
            local label="$1" data="$2"
            local n=$(echo "$data" | cut -d'|' -f1)
            local avg=$(echo "$data" | cut -d'|' -f2)
            local mn=$(echo "$data" | cut -d'|' -f3)
            local mx=$(echo "$data" | cut -d'|' -f4)
            local sp=$(speedup "$avg")
            echo "| $label | $n | $avg | $mn | $mx | $sp |"
          }

          # Annotate the current run's bucket
          CURRENT_LEVEL="—"
          CURRENT_LINE=""
          CMS=${CURRENT_LINT_MS:-0}
          CSEC=$(awk "BEGIN { printf \"%.2fs\", $CMS / 1000 }")
          if [ "${{ steps.eslint-cache.outputs.cache-hit }}" = "true" ]; then
            CURRENT_LEVEL="L0 (exact hit)"
          elif [ -n "${{ steps.eslint-cache.outputs.cache-matched-key }}" ]; then
            # Reuse the same level detection logic via the status line we already printed
            if grep -q "L1 — same sources" <<<"${{ steps.eslint-cache.outputs.cache-matched-key }}"; then CURRENT_LEVEL="L1"; fi
          fi

          {
            echo ""
            echo "## Lint time vs cache level (last 20 runs on \`$BRANCH\`)"
            echo ""
            echo "Baseline (no cache) avg = **${BASELINE_MS:-—}s**"
            echo ""
            echo "| Cache level | Runs | Avg | Min | Max | Speedup vs miss |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: |"
            row "✅ L0 — exact hit" "$L0"
            row "♻️ L1 — same sources" "$L1"
            row "♻️ L2 — same config" "$L2"
            row "♻️ L3 — version only" "$L3"
            row "❌ Miss" "$MS"
            echo ""
            echo "**This run:** lint = \`$CSEC\` (level: \`$CURRENT_LEVEL\`)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Lint-time-by-cache-level summary written."

          # ---------- Bar chart (SVG, inlined into the summary) ----------
          mkdir -p reports
          # Pass bucket data into the node script via env
          export L0_DATA="$L0" L1_DATA="$L1" L2_DATA="$L2" L3_DATA="$L3" MS_DATA="$MS"
          # Sanitize render scale (positive integer, default 2, cap at 6)
          RAW_SCALE="${CHART_RENDER_SCALE:-2}"
          case "$RAW_SCALE" in
            ''|*[!0-9]*) SCALE=2 ;;
            *) SCALE=$RAW_SCALE ;;
          esac
          if [ "$SCALE" -lt 1 ]; then SCALE=1; fi
          if [ "$SCALE" -gt 6 ]; then SCALE=6; fi
          export CHART_SCALE="$SCALE"
          echo "Chart render scale: ${SCALE}x"
          node -e "
            const fs = require('fs');
            const parseAvg = (d) => {
              const sec = (d || '').split('|')[1] || '';
              const n = parseFloat(sec.replace('s',''));
              return isFinite(n) ? n : 0;
            };
            const parseN = (d) => parseInt(((d || '').split('|')[0] || '0'), 10) || 0;
            const SCALE = Math.max(1, parseInt(process.env.CHART_SCALE || '2', 10) || 2);
            const data = [
              { label: 'L0 exact',      avg: parseAvg(process.env.L0_DATA), n: parseN(process.env.L0_DATA), color: '#2da44e' },
              { label: 'L1 sources',    avg: parseAvg(process.env.L1_DATA), n: parseN(process.env.L1_DATA), color: '#46954a' },
              { label: 'L2 config',     avg: parseAvg(process.env.L2_DATA), n: parseN(process.env.L2_DATA), color: '#bf8700' },
              { label: 'L3 version',    avg: parseAvg(process.env.L3_DATA), n: parseN(process.env.L3_DATA), color: '#d29922' },
              { label: 'Miss',          avg: parseAvg(process.env.MS_DATA), n: parseN(process.env.MS_DATA), color: '#cf222e' },
            ];
            const maxAvg = Math.max(0.001, ...data.map(d => d.avg));
            const W = 720, H = 320, pad = { l: 110, r: 24, t: 32, b: 56 };
            const chartW = W - pad.l - pad.r;
            const chartH = H - pad.t - pad.b;
            const barH = chartH / data.length - 8;

            const bars = data.map((d, i) => {
              const y = pad.t + i * (barH + 8);
              const w = d.n > 0 ? Math.max(2, (d.avg / maxAvg) * chartW) : 0;
              const labelOutside = w < 60;
              const valueText = d.n > 0 ? d.avg.toFixed(2) + 's (n=' + d.n + ')' : 'no data';
              return [
                \`<text x='\${pad.l - 8}' y='\${y + barH/2 + 4}' text-anchor='end' font-size='13' fill='#24292f'>\${d.label}</text>\`,
                d.n > 0
                  ? \`<rect x='\${pad.l}' y='\${y}' width='\${w}' height='\${barH}' fill='\${d.color}' rx='3'/>\`
                  : \`<rect x='\${pad.l}' y='\${y}' width='\${chartW}' height='\${barH}' fill='none' stroke='#d0d7de' stroke-dasharray='4 3' rx='3'/>\`,
                \`<text x='\${pad.l + (labelOutside ? w + 6 : w - 6)}' y='\${y + barH/2 + 4}' text-anchor='\${labelOutside ? \"start\" : \"end\"}' font-size='12' fill='\${labelOutside ? \"#24292f\" : \"#fff\"}' font-weight='600'>\${valueText}</text>\`,
              ].join('');
            }).join('');

            // X axis ticks (4 segments)
            const ticks = [0, 0.25, 0.5, 0.75, 1].map(t => {
              const x = pad.l + t * chartW;
              const v = (maxAvg * t).toFixed(2);
              return \`
                <line x1='\${x}' y1='\${pad.t}' x2='\${x}' y2='\${pad.t + chartH}' stroke='#eaeef2' stroke-width='1'/>
                <text x='\${x}' y='\${pad.t + chartH + 18}' text-anchor='middle' font-size='11' fill='#57606a'>\${v}s</text>\`;
            }).join('');

            // Apply render scale to width/height while keeping viewBox at logical units
            // — crisper rendering on HiDPI and in raster conversion without changing layout.
            const svg = \`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 \${W} \${H}' width='\${W * SCALE}' height='\${H * SCALE}' role='img' aria-label='Average lint time by cache level'>
              <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }</style>
              <rect width='100%' height='100%' fill='#ffffff'/>
              <text x='\${W/2}' y='20' text-anchor='middle' font-size='14' font-weight='700' fill='#24292f'>Average lint time by cache level</text>
              \${ticks}
              \${bars}
              <line x1='\${pad.l}' y1='\${pad.t}' x2='\${pad.l}' y2='\${pad.t + chartH}' stroke='#24292f' stroke-width='1'/>
              <line x1='\${pad.l}' y1='\${pad.t + chartH}' x2='\${pad.l + chartW}' y2='\${pad.t + chartH}' stroke='#24292f' stroke-width='1'/>
            </svg>\`;
            fs.writeFileSync('reports/lint-time-by-cache.svg', svg);
            console.log('Wrote reports/lint-time-by-cache.svg (scale=' + SCALE + 'x)');
          " || echo "Chart generation skipped (node error)"

          # Inline the SVG directly into the summary as a base64 data URI so it
          # renders without needing artifact download or external hosting.
          if [ -s reports/lint-time-by-cache.svg ]; then
            DATA_URI="data:image/svg+xml;base64,$(base64 -w0 reports/lint-time-by-cache.svg)"
            {
              echo ""
              echo "### 📊 Lint time by cache level (chart)"
              echo ""
              echo "<img alt='Average lint time by cache level' src='$DATA_URI' />"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Convert chart SVG to PNG
        if: always()
        continue-on-error: true
        run: |
          if [ ! -s reports/lint-time-by-cache.svg ]; then
            echo "No SVG to convert."
            exit 0
          fi
          # Match the SVG render scale so PNG resolution stays consistent.
          RAW_SCALE="${CHART_RENDER_SCALE:-2}"
          case "$RAW_SCALE" in
            ''|*[!0-9]*) SCALE=2 ;;
            *) SCALE=$RAW_SCALE ;;
          esac
          if [ "$SCALE" -lt 1 ]; then SCALE=1; fi
          if [ "$SCALE" -gt 6 ]; then SCALE=6; fi
          BASE_W=720
          PNG_W=$((BASE_W * SCALE))
          # ImageMagick density: 96 DPI baseline × scale
          IM_DENSITY=$((96 * SCALE))
          echo "PNG render: width=${PNG_W}px (scale=${SCALE}x)"
          # rsvg-convert is preinstalled on ubuntu-latest runners (librsvg2-bin).
          # Fall back to apt install on stripped images, then ImageMagick as a last resort.
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin || true
          fi
          if command -v rsvg-convert >/dev/null 2>&1; then
            rsvg-convert -w "$PNG_W" reports/lint-time-by-cache.svg -o reports/lint-time-by-cache.png
            echo "Converted via rsvg-convert: $(du -h reports/lint-time-by-cache.png | cut -f1)"
            CONVERTER="rsvg-convert"
          elif command -v convert >/dev/null 2>&1; then
            convert -density "$IM_DENSITY" -background white reports/lint-time-by-cache.svg reports/lint-time-by-cache.png
            echo "Converted via ImageMagick: $(du -h reports/lint-time-by-cache.png | cut -f1)"
            CONVERTER="imagemagick"
          else
            echo "::warning::No SVG→PNG converter available (rsvg-convert / convert); skipping PNG."
            CONVERTER="none"
          fi

          # Persist the chart-render configuration alongside the diff artifact
          # so downstream debugging can correlate PNG dimensions with the run.
          mkdir -p reports
          PNG_BYTES=$([ -s reports/lint-time-by-cache.png ] && stat -c%s reports/lint-time-by-cache.png || echo 0)
          jq -n \
            --arg raw_scale "${CHART_RENDER_SCALE:-2}" \
            --argjson scale "$SCALE" \
            --argjson base_width_px "$BASE_W" \
            --argjson png_width_px "$PNG_W" \
            --argjson imagemagick_density "$IM_DENSITY" \
            --arg converter "${CONVERTER:-unknown}" \
            --argjson png_bytes "$PNG_BYTES" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            '{
              source: "chart-render-config",
              env: { CHART_RENDER_SCALE: $raw_scale },
              effective_scale: $scale,
              base_width_px: $base_width_px,
              png_width_px: $png_width_px,
              imagemagick_density_dpi: $imagemagick_density,
              converter: $converter,
              png_bytes: $png_bytes,
              generated_at: $generated_at
            }' > reports/chart-render-config.json
          echo "Wrote reports/chart-render-config.json"
          cat reports/chart-render-config.json

      - name: Compare matched_runs between history debug files
        if: always()
        continue-on-error: true
        env:
          WORKFLOW_FILE: ci.yml
        run: |
          A=reports/cache-history-debug.json
          B=reports/lint-time-history-debug.json
          OUT=reports/history-debug-diff.json
          if [ ! -s "$A" ] || [ ! -s "$B" ]; then
            echo "One or both history debug files missing — skipping diff."
            echo "  cache-history: $([ -s "$A" ] && echo present || echo missing)"
            echo "  lint-time-history: $([ -s "$B" ] && echo present || echo missing)"
            {
              echo ""
              echo "## History debug diff"
              echo ""
              echo "_Skipped — one or both debug files are missing._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---------------------------------------------------------------
          # Strong pinning check: refuse to diff unless BOTH debug files
          # pin to the SAME workflow_file_sha AND that SHA matches the one
          # resolved from the current commit's .github/workflows/ci.yml.
          # This prevents misleading diffs across CI configuration changes.
          # ---------------------------------------------------------------
          WORKFLOW_PATH=".github/workflows/${WORKFLOW_FILE}"
          CURRENT_WF_SHA=$(git rev-parse "${{ github.sha }}:${WORKFLOW_PATH}" 2>/dev/null || echo "")
          SHA_A=$(jq -r '.current_workflow_file_sha // ""' "$A")
          SHA_B=$(jq -r '.current_workflow_file_sha // ""' "$B")

          PIN_OK=true
          PIN_REASON=""
          if [ -z "$CURRENT_WF_SHA" ]; then
            PIN_OK=false
            PIN_REASON="could not resolve current workflow file SHA"
          elif [ -z "$SHA_A" ] || [ -z "$SHA_B" ]; then
            PIN_OK=false
            PIN_REASON="one or both debug files missing current_workflow_file_sha"
          elif [ "$SHA_A" != "$SHA_B" ]; then
            PIN_OK=false
            PIN_REASON="debug files pin to different workflow SHAs (A=$SHA_A, B=$SHA_B)"
          elif [ "$SHA_A" != "$CURRENT_WF_SHA" ]; then
            PIN_OK=false
            PIN_REASON="debug files pinned to $SHA_A but current workflow SHA is $CURRENT_WF_SHA"
          fi

          # Also require every row's workflow_file_sha to match (defense-in-depth
          # against any future row-builder bug that lets stale rows slip through).
          if [ "$PIN_OK" = "true" ]; then
            ROW_OK=$(jq -r --arg sha "$CURRENT_WF_SHA" '
              ((.matched_runs // []) | map(.workflow_file_sha // "") | unique) as $shas
              | if ($shas | length) == 0 then "true"
                elif ($shas | length) == 1 and ($shas[0] == $sha) then "true"
                else "false" end
            ' "$A")
            ROW_OK_B=$(jq -r --arg sha "$CURRENT_WF_SHA" '
              ((.matched_runs // []) | map(.workflow_file_sha // "") | unique) as $shas
              | if ($shas | length) == 0 then "true"
                elif ($shas | length) == 1 and ($shas[0] == $sha) then "true"
                else "false" end
            ' "$B")
            if [ "$ROW_OK" != "true" ] || [ "$ROW_OK_B" != "true" ]; then
              PIN_OK=false
              PIN_REASON="matched_runs[].workflow_file_sha does not uniformly match current workflow SHA"
            fi
          fi

          if [ "$PIN_OK" != "true" ]; then
            echo "::warning::Refusing to compare history debug files — $PIN_REASON"
            jq -n \
              --arg current_workflow_file_sha "$CURRENT_WF_SHA" \
              --arg sha_a "$SHA_A" \
              --arg sha_b "$SHA_B" \
              --arg reason "$PIN_REASON" \
              --arg generated_at "$(date -u +%FT%TZ)" \
              '{
                source: "history-debug-diff",
                status: "skipped",
                reason: $reason,
                pinning: {
                  current_workflow_file_sha: $current_workflow_file_sha,
                  workflow_file_sha_a: $sha_a,
                  workflow_file_sha_b: $sha_b,
                  current_short: ($current_workflow_file_sha | .[0:7]),
                  a_short: ($sha_a | .[0:7]),
                  b_short: ($sha_b | .[0:7])
                },
                generated_at: $generated_at
              }' > "$OUT"
            {
              echo ""
              echo "## History debug diff"
              echo ""
              echo "⛔ **Skipped** — workflow file SHA pinning check failed."
              echo ""
              echo "_Reason:_ $PIN_REASON"
              echo ""
              echo "| Source | workflow_file_sha |"
              echo "| --- | --- |"
              echo "| current run | \`${CURRENT_WF_SHA:0:7}\` |"
              echo "| cache-history | \`${SHA_A:0:7}\` |"
              echo "| lint-time-history | \`${SHA_B:0:7}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Pinning OK: both files match current workflow SHA ${CURRENT_WF_SHA:0:7}."

          # Compare the matched_runs arrays from both files.
          # Identity = run id. Report:
          #   - same workflow_file_sha pinning (sanity check)
          #   - ids only in A, ids only in B, ids in both
          #   - per-run field mismatches for shared ids (created_at/event/url)
          jq -n \
            --slurpfile a "$A" \
            --slurpfile b "$B" \
            --arg current_workflow_file_sha "$CURRENT_WF_SHA" \
            '
              ($a[0]) as $A | ($b[0]) as $B
              | ($A.matched_runs // []) as $ar
              | ($B.matched_runs // []) as $br
              | ($ar | map(.id)) as $aids
              | ($br | map(.id)) as $bids
              | ($aids - $bids) as $only_in_a
              | ($bids - $aids) as $only_in_b
              | ($aids - ($aids - $bids)) as $shared
              | {
                  status: "compared",
                  source_a: $A.source,
                  source_b: $B.source,
                  workflow_sha_match: ($A.current_workflow_file_sha == $B.current_workflow_file_sha),
                  workflow_sha_a: $A.current_workflow_file_sha,
                  workflow_sha_b: $B.current_workflow_file_sha,
                  pinning: {
                    current_workflow_file_sha: $current_workflow_file_sha,
                    matches_current: (
                      $A.current_workflow_file_sha == $current_workflow_file_sha and
                      $B.current_workflow_file_sha == $current_workflow_file_sha
                    )
                  },
                  branch_a: $A.branch,
                  branch_b: $B.branch,
                  matched_count_a: ($ar | length),
                  matched_count_b: ($br | length),
                  workflow_version_a: ($A.workflow_version // {
                    sha_short: ($A.current_workflow_file_sha | .[0:7]),
                    sha_full: $A.current_workflow_file_sha,
                    candidates_scanned: $A.candidates_scanned,
                    matched_count: $A.matched_count
                  }),
                  workflow_version_b: ($B.workflow_version // {
                    sha_short: ($B.current_workflow_file_sha | .[0:7]),
                    sha_full: $B.current_workflow_file_sha,
                    candidates_scanned: $B.candidates_scanned,
                    matched_count: $B.matched_count
                  }),
                  identical_id_sets: (($only_in_a | length) == 0 and ($only_in_b | length) == 0),
                  only_in_a: $only_in_a,
                  only_in_b: $only_in_b,
                  shared_ids: $shared,
                  field_mismatches: [
                    $shared[] as $id
                    | ($ar[] | select(.id == $id)) as $ra
                    | ($br[] | select(.id == $id)) as $rb
                    | {
                        id: $id,
                        diffs: (
                          [["head_sha", $ra.head_sha, $rb.head_sha],
                           ["created_at", $ra.created_at, $rb.created_at],
                           ["event", $ra.event, $rb.event],
                           ["workflow_file_sha", $ra.workflow_file_sha, $rb.workflow_file_sha],
                           ["html_url", $ra.html_url, $rb.html_url]]
                          | map(select(.[1] != .[2]) | {field: .[0], a: .[1], b: .[2]})
                        )
                      }
                    | select(.diffs | length > 0)
                  ]
                }
            ' > "$OUT"

          echo "Wrote $OUT"
          cat "$OUT"

          IDENTICAL=$(jq -r '.identical_id_sets' "$OUT")
          SHA_OK=$(jq -r '.workflow_sha_match' "$OUT")
          A_CNT=$(jq -r '.matched_count_a' "$OUT")
          B_CNT=$(jq -r '.matched_count_b' "$OUT")
          ONLY_A=$(jq -r '.only_in_a | length' "$OUT")
          ONLY_B=$(jq -r '.only_in_b | length' "$OUT")
          SHARED=$(jq -r '.shared_ids | length' "$OUT")
          MISMATCHES=$(jq -r '.field_mismatches | length' "$OUT")

          if [ "$IDENTICAL" = "true" ] && [ "$SHA_OK" = "true" ] && [ "$MISMATCHES" = "0" ]; then
            VERDICT="✅ Identical"
          elif [ "$IDENTICAL" = "true" ] && [ "$SHA_OK" = "true" ]; then
            VERDICT="⚠️ Same id set, $MISMATCHES field mismatch(es)"
          else
            VERDICT="❌ Differ"
          fi

          {
            echo ""
            echo "## History debug diff"
            echo ""
            echo "Compares \`matched_runs\` between the two debug artifacts to confirm both"
            echo "history queries (cache hit-rate vs lint-time-by-cache) saw the same runs."
            echo ""
            echo "| Field | cache-history | lint-time-history |"
            echo "| --- | --- | --- |"
            echo "| matched_count | $A_CNT | $B_CNT |"
            echo "| workflow_file_sha | \`$(jq -r '.workflow_sha_a[0:7]' "$OUT") \` | \`$(jq -r '.workflow_sha_b[0:7]' "$OUT") \` |"
            echo "| branch | $(jq -r '.branch_a' "$OUT") | $(jq -r '.branch_b' "$OUT") |"
            echo ""
            echo "**Verdict:** $VERDICT"
            echo ""
            echo "- Shared run ids: **$SHARED**"
            echo "- Only in cache-history: **$ONLY_A**"
            echo "- Only in lint-time-history: **$ONLY_B**"
            echo "- Field mismatches on shared ids: **$MISMATCHES**"
            if [ "$ONLY_A" != "0" ] || [ "$ONLY_B" != "0" ] || [ "$MISMATCHES" != "0" ]; then
              echo ""
              echo "<details><summary>Diff details</summary>"
              echo ""
              echo '```json'
              jq '{only_in_a, only_in_b, field_mismatches}' "$OUT"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ESLint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-reports
          path: |
            reports/eslint-report.json
            reports/eslint-report.html
            reports/eslint-failed-files.json
            reports/eslint-timing.json
            reports/eslint-rule-timing.txt
            reports/lint-time-by-cache.svg
            reports/lint-time-by-cache.png
            reports/cache-history-debug.json
            reports/lint-time-history-debug.json
            reports/history-debug-diff.json
            reports/chart-render-config.json
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if ESLint reported errors
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "ESLint reported errors — see the 'eslint-reports' artifact and job summary."
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build