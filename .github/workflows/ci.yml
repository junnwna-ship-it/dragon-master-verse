name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve ESLint version
        id: eslint-version
        run: |
          VERSION=$(node -p "require('./node_modules/eslint/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ESLint version: $VERSION"

      - name: Restore ESLint cache
        id: eslint-cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          # Cache key dimensions:
          #   - OS                       → runner-specific binaries
          #   - ESLint version           → cache format changes between versions
          #   - Lint config + tsconfig   → rule changes invalidate results
          #   - Lockfile                 → plugin/parser updates invalidate results
          #   - Source globs hash        → narrows to actually-linted files
          #   - SHA                      → unique per commit (write key)
          key: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb', 'src/**/*.ts', 'src/**/*.tsx') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb', 'src/**/*.ts', 'src/**/*.tsx') }}-
            ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb') }}-
            ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-

      - name: Report ESLint cache status
        if: always()
        env:
          PRIMARY_KEY: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb', 'src/**/*.ts', 'src/**/*.tsx') }}-${{ github.sha }}
          MATCHED_KEY: ${{ steps.eslint-cache.outputs.cache-matched-key }}
          EXACT_HIT: ${{ steps.eslint-cache.outputs.cache-hit }}
          SRC_KEY_PREFIX: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb', 'src/**/*.ts', 'src/**/*.tsx') }}-
          CFG_KEY_PREFIX: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-${{ hashFiles('eslint.config.js', 'tsconfig.json', 'bun.lockb') }}-
          VER_KEY_PREFIX: ${{ runner.os }}-eslint-v${{ steps.eslint-version.outputs.version }}-
        run: |
          if [ "$EXACT_HIT" = "true" ]; then
            STATUS="✅ Exact hit"
            LEVEL="L0 — primary key (same commit)"
          elif [ -z "$MATCHED_KEY" ]; then
            STATUS="❌ Miss (no cache restored)"
            LEVEL="—"
          else
            STATUS="♻️ Partial restore"
            case "$MATCHED_KEY" in
              "$SRC_KEY_PREFIX"*) LEVEL="L1 — same sources + config (different commit)" ;;
              "$CFG_KEY_PREFIX"*) LEVEL="L2 — same config + deps (sources changed)" ;;
              "$VER_KEY_PREFIX"*) LEVEL="L3 — same ESLint version only (config changed)" ;;
              *)                  LEVEL="L? — unrecognized restore-key" ;;
            esac
          fi

          # Cache size (if restored)
          if [ -d node_modules/.cache/eslint ]; then
            SIZE=$(du -sh node_modules/.cache/eslint 2>/dev/null | cut -f1)
            FILES=$(find node_modules/.cache/eslint -type f 2>/dev/null | wc -l | tr -d ' ')
          else
            SIZE="0"
            FILES="0"
          fi

          {
            echo "## ESLint cache"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | $STATUS |"
            echo "| Restore level | $LEVEL |"
            echo "| ESLint version | ${{ steps.eslint-version.outputs.version }} |"
            echo "| Primary key | \`$PRIMARY_KEY\` |"
            echo "| Matched key | \`${MATCHED_KEY:-<none>}\` |"
            echo "| Cache size | $SIZE ($FILES files) |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "ESLint cache: $STATUS — $LEVEL"
          echo "  primary key : $PRIMARY_KEY"
          echo "  matched key : ${MATCHED_KEY:-<none>}"
          echo "  cache size  : $SIZE ($FILES files)"

      - name: Run ESLint (JSON report)
        id: eslint
        continue-on-error: true
        run: |
          mkdir -p reports
          bun run lint:report

      - name: Generate HTML report
        if: always()
        continue-on-error: true
        run: bun run lint:report:html

      - name: Annotate PR with ESLint findings
        if: always()
        uses: ataylorme/eslint-annotate-action@v3
        with:
          report-json: reports/eslint-report.json
          fail-on-warning: false
          fail-on-error: false
          markdown-report-on-step-summary: true

      - name: Upload ESLint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-reports
          path: reports/
          retention-days: 14

      - name: Fail if ESLint reported errors
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "ESLint reported errors — see the 'eslint-reports' artifact and job summary."
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build